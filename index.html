<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海盜模組手冊 / Pirate Mod Guide</title>
<meta name="description" content="海盜 遊戲的模組製作手冊。Mod making guide for Pirate.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<style>
  /* 語言選擇頁是唯一沒有側邊欄的頁，樣式獨立 */
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .picker { text-align: center; max-width: 480px; width: 100%; }
  .picker h1 { font-size: 26px; margin-bottom: 6px; }
  .picker .sub { color: var(--fg-dim); font-size: 14px; margin-bottom: 32px; }
  .picker a.big {
    display: block;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--fg);
    text-align: left;
  }
  .picker a.big:hover { border-color: var(--accent); }
  .picker a.big .l { font-weight: 600; font-size: 17px; }
  .picker a.big .r { color: var(--fg-dim); font-size: 13px; margin-top: 2px; }
  .picker .foot { color: var(--fg-dim); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="picker">
  <h1>海盜 模組製作手冊</h1>
  <div class="sub">Pirate Mod Making Guide &middot; パイレーツ MOD制作ガイド</div>

  <a class="big" href="zh-TW/index.html"><div class="l">繁體中文</div><div class="r">模組製作手冊</div></a>
  <a class="big" href="zh-CN/index.html"><div class="l">简体中文</div><div class="r">模组制作手册</div></a>
  <a class="big" href="en/index.html"><div class="l">English</div><div class="r">Mod Making Guide</div></a>
  <a class="big" href="ja/index.html"><div class="l">日本語</div><div class="r">MOD制作ガイド</div></a>

  <div class="foot">選擇語言 &middot; Choose a language &middot; 言語を選択</div>
</div>

<script>
/* 依瀏覽器語言自動跳轉。
   只在「使用者是直接開根網址」時跳 —— 有 ?stay 參數就不跳，
   避免從語言選擇連結回來又被踢走（例如手冊內連回首頁想換語言）。 */
(function () {
  if (location.search.indexOf('stay') >= 0) return;
  try {
    if (sessionStorage.getItem('pg-picked')) return;   // 這次工作階段已經選過，不再自動跳
  } catch (e) { /* 隱私模式可能整個 throw，忽略 */ }

  var l = (navigator.language || 'en').toLowerCase();
  var target = null;
  // 分開判斷：zh-cn / zh-hans / zh-sg 走簡體，其餘中文走繁體
  if (l.indexOf('zh-cn') === 0 || l.indexOf('zh-hans') === 0 || l.indexOf('zh-sg') === 0) {
    target = 'zh-CN/index.html';
  }
  else if (l.indexOf('zh') === 0) target = 'zh-TW/index.html';
  else if (l.indexOf('ja') === 0) target = 'ja/index.html';
  else target = 'en/index.html';

  try { sessionStorage.setItem('pg-picked', '1'); } catch (e) {}
  location.replace(target);
})();
</script>
</body>
</html>
